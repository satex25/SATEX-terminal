[package]
name = "satex-parity"
description = "THE ORACLE: corpus reader, golden loader, structural diff engine, drift reports, baseline comparators (RS-1.4). Dev/CI tool — never shipped in the terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# D-012 crate-budget justification (RS-1.4). One direct runtime dependency.
#
# sha2 — SHA-256 over corpus tapes and golden streams. The corpus manifest and the
# RS-1.3 golden manifest both pin content by SHA-256 (`corpus-index.json`,
# `*.manifest.json`), and §5.2 makes a changed digest an incident rather than a merge
# conflict; the reader cannot enforce that rule without computing the same digest.
# Pinned to the 0.10 line rather than 0.11: 0.10.9 is already in the local registry
# cache, so gate runs stay hermetic when the sandbox has no network, and 0.10 is the
# line the rest of the RustCrypto ecosystem currently pins (re-verified live via
# `cargo search sha2`, 2026-08-06, per RS-L5 — 0.11.0 exists and is a deliberate
# not-yet, revisited when a consumer needs digest 0.11).
#
# Everything else is std on purpose. JSON is parsed and re-serialised by this crate's
# own `value` module rather than by serde_json, because the oracle needs three
# behaviours serde_json does not offer together: JS `JSON.parse` overflow semantics
# (`1e999` is `Infinity`, not a parse error — Appendix B.3 makes that a *caught engine
# bug*, and a parse error would report the wrong divergence category), UTF-16 code-unit
# key ordering to match `Object.keys().sort()`, and JS shortest-round-trip number
# formatting. A third-party parser would have to be corrected on all three, which is
# more code than the parser.
[dependencies]
sha2 = "0.10.9"

[lints]
workspace = true
